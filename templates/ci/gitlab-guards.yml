bkhar-guards:
  image: python:3.12
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - python .bkhar/guards/precommit.py --all

bkhar-deps:
  image: python:3.12
  script:
    - curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
    - echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  osv-scanner" | sha256sum -c -
    - chmod +x osv-scanner
    - code=0; ./osv-scanner scan source -r . || code=$?
    - if [ "$code" -eq 128 ]; then echo "nenhum lockfile encontrado: sem dependência para varrer"; exit 0; fi
    - exit "$code"
